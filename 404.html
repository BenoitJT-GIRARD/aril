<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not published — aril</title>
<meta name="description" content="Namespace for persistent identifiers used by a metadata vocabulary for animal behaviour data.">
<meta name="robots" content="noindex">
<style>
  :root {
    color-scheme: light dark;
    --fg: #1a1a1a;
    --muted: #5c5c5c;
    --bg: #fdfdfc;
    --rule: #e2e0dc;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e6e3; --muted: #9a9894; --bg: #17181a; --rule: #2e3033; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 4rem 1rem;
    background: var(--bg);
    color: var(--fg);
    font: 1rem/1.65 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 34rem; margin: 0 auto; }
  h1 {
    font: 600 1.25rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    letter-spacing: 0.02em;
    margin: 0 0 2rem;
  }
  p { margin: 0 0 1.25rem; }
  code {
    font: 0.9em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    overflow-wrap: anywhere;
  }
  .note { color: var(--muted); }
  footer {
    margin-top: 3rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.9rem;
  }
  a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>aril</h1>

  <p>
    Nothing is published under this identifier yet.
  </p>

  <p class="note">
    Identifiers under <code>https://w3id.org/aril</code> name the parts of a metadata vocabulary
    for animal behaviour data. They are minted as the vocabulary is released; this one has not
    been. The address will keep working once it has.
  </p>

  <footer>
    <a href="/aril/">aril</a> · Benoît Girard
  </footer>
</main>
</body>
</html>
